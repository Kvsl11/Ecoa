# O app de Android do Ecoa (o APK): o mesmo site (kvsl11.github.io/Ecoa) dentro de um app, com o widget da tela
# inicial, o aviso de "tocando" com os botões e o login do Google pelo próprio Android. Publicado em
# Releases → android (o arquivo Ecoa.apk), que o botão "Baixar o app para Android" do site baixa.
# O site muda sozinho dentro do app (ele abre o site publicado), mas o APK também é recompilado a cada push:
# assim cada merge recebe um versionCode novo e o arquivo de versão chega ao site após a publicação do APK.
# Fora do ramo principal, só monta (não publica).
#
# A chave que assina o APK tem de ser sempre a mesma (senão o novo não instala por cima do anterior). Ela fica no
# repositório trancada (app-android/chave/ecoa.p12.enc), e só abre com a senha do segredo ECOA_CHAVE_SENHA. Na primeira
# vez, sem a chave, o robô cria uma e guarda trancada. Veja app-android/LEIA-ME.md
name: App de Android

on:
  workflow_dispatch:
  # Não filtrar por pasta: alterações do site também precisam atualizar o APK/versão publicados,
  # evitando que o APK instalado fique sem receber a versão correspondente ao último merge.
  push:

# (uma montagem por vez, na fila: antes a nova cancelava a que estava montando, e a primeira chave, criada pela de
# antes, fazia a de depois falhar)
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Publica somente quando a execução estiver na branch padrão configurada no próprio GitHub.
      # Assim, builds de branches de trabalho nunca substituem a Release de produção.
      PRINCIPAL: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      ECOA_CHAVE_SENHA: ${{ secrets.ECOA_CHAVE_SENHA }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do aplicativo
        run: |
          npm ci
          npm test
      - name: Preparar o projeto (o Capacitor copia a configuração para o Android)
        working-directory: app-android
        run: |
          npm ci
          node scripts/preparar-web.mjs
          npx cap sync android

      - name: A chave que assina o APK
        id: chave
        run: |
          set -e
          ENC=app-android/chave/ecoa.p12.enc
          mkdir -p "$RUNNER_TEMP/chave"
          P12="$RUNNER_TEMP/chave/ecoa.p12"
          if [ -z "$ECOA_CHAVE_SENHA" ] && [ "$PRINCIPAL" != "true" ]; then
            # (fora do ramo principal o APK não é publicado: sem a senha, uma chave descartável só para conferir que ele monta)
            export ECOA_CHAVE_SENHA="$(openssl rand -hex 24)"
            echo "::add-mask::$ECOA_CHAVE_SENHA"
            printf '%s' "$ECOA_CHAVE_SENHA" > "$RUNNER_TEMP/chave/senha-descartavel"
            keytool -genkeypair -storetype PKCS12 -keystore "$P12" -alias ecoa -keyalg RSA -keysize 2048 -validity 30 \
              -storepass "$ECOA_CHAVE_SENHA" -keypass "$ECOA_CHAVE_SENHA" -dname "CN=Ecoa teste"
            echo "arquivo=$P12" >> "$GITHUB_OUTPUT"
            echo "Montado com uma chave descartável (fora do ramo principal, sem publicar)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$ECOA_CHAVE_SENHA" ]; then
            echo "::error::Falta o segredo ECOA_CHAVE_SENHA (Settings → Secrets and variables → Actions). Veja app-android/LEIA-ME.md"
            exit 1
          fi
          # (a chave pode ter sido criada por outra montagem depois da versão que esta pegou: vem do ramo, se já estiver lá)
          if [ ! -f "$ENC" ] && [ "$PRINCIPAL" = "true" ]; then
            git fetch -q origin "$GITHUB_REF_NAME" && git checkout -q "origin/$GITHUB_REF_NAME" -- "$ENC" 2>/dev/null || true
          fi
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$ENC" -out "$P12" -pass env:ECOA_CHAVE_SENHA \
              || { echo "::error::A senha do segredo ECOA_CHAVE_SENHA não abre a chave guardada (ela mudou?)"; exit 1; }
          else
            # (a primeira vez: cria a chave, válida por 30 anos, e guarda trancada no repositório)
            keytool -genkeypair -v -storetype PKCS12 -keystore "$P12" -alias ecoa -keyalg RSA -keysize 4096 -validity 11000 \
              -storepass "$ECOA_CHAVE_SENHA" -keypass "$ECOA_CHAVE_SENHA" -dname "CN=Ecoa, O=Ecoa, C=BR"
            mkdir -p app-android/chave
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$P12" -out "$ENC" -pass env:ECOA_CHAVE_SENHA
            if [ "$PRINCIPAL" = "true" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$ENC"
              git commit -m "App de Android: a chave que assina o APK (trancada com a senha do segredo ECOA_CHAVE_SENHA)"
              git push
            fi
          fi
          echo "arquivo=$P12" >> "$GITHUB_OUTPUT"
          # (as impressões digitais da chave: a SHA-1 vai no Firebase, para o login do Google pelo Android)
          keytool -list -v -keystore "$P12" -storepass "$ECOA_CHAVE_SENHA" -alias ecoa | grep -E "SHA1:|SHA256:" > "$RUNNER_TEMP/digitais.txt"
          {
            echo "### Impressões digitais da chave do APK"
            echo "Cole a **SHA-1** no Firebase (Configurações do projeto → Seus apps → app Android \`br.ecoa.app\` → Adicionar impressão digital):"
            echo '```'
            cat "$RUNNER_TEMP/digitais.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validar a API Gemini com a assinatura Android do APK
        if: env.PRINCIPAL == 'true'
        env:
          ECOA_GEMINI_CHAVE: ${{ secrets.GEMINI_API_KEY_APK }}
        run: |
          set -euo pipefail
          if [ -z "$ECOA_GEMINI_CHAVE" ]; then
            echo "::error::Falta o segredo GEMINI_API_KEY_APK."
            exit 1
          fi
          # Reproduz exatamente a normalização usada pelo BuildConfig, sem imprimir a chave.
          CHAVE="$(printf '%s' "$ECOA_GEMINI_CHAVE" | tr -cd '[:alnum:]_-')"
          if [ -z "$CHAVE" ]; then
            echo "::error::O segredo GEMINI_API_KEY_APK não contém uma chave válida."
            exit 1
          fi
          echo "::add-mask::$CHAVE"
          SHA1="$(awk '/SHA1:/{gsub(":", "", $2); print toupper($2); exit}' "$RUNNER_TEMP/digitais.txt")"
          if [ -z "$SHA1" ]; then
            echo "::error::Não foi possível obter a SHA-1 do certificado que assina o APK."
            exit 1
          fi
          # O Google recebe o mesmo pacote e a mesma SHA-1 que o plugin Java envia no celular.
          CONFIG="$RUNNER_TEMP/gemini-curl.conf"
          BODY="$RUNNER_TEMP/gemini-validacao.json"
          printf 'header = "x-goog-api-key: %s"\nheader = "X-Android-Package: br.ecoa.app"\nheader = "X-Android-Cert: %s"\n' "$CHAVE" "$SHA1" > "$CONFIG"
          chmod 600 "$CONFIG"
          set +e
          HTTP="$(curl --config "$CONFIG" --silent --show-error --output "$BODY" --write-out '%{http_code}' \
            'https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000')"
          CURL_STATUS=$?
          set -e
          if [ "$CURL_STATUS" -ne 0 ] || [ "$HTTP" != "200" ]; then
            MSG="$(node -e 'const fs=require("node:fs");try{const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log(d.error?.message||"O Google não retornou detalhes.");}catch{console.log("Não foi possível ler a resposta do Google.");}' "$BODY")"
            MSG="$(printf '%s' "$MSG" | tr '\n\r' '  ' | cut -c1-300)"
            rm -f "$CONFIG"
            echo "::error::A API Gemini recusou a chave deste APK (HTTP ${HTTP:-sem resposta}): $MSG. Confira a chave, a Generative Language API e as restrições Android para br.ecoa.app + SHA-1 deste certificado."
            exit 1
          fi
          # Verifica também generateContent, a mesma operação usada pelo Lúmen e pela transcrição.
          MODELO="$(node -e 'const fs=require("node:fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const ms=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")&&/^models\/gemini-.*flash/i.test(m.name||"")&&!/(tts|image|live|audio|embedding|vision|learnlm|gemma|robotics|computer|thinking|exp|8b)/i.test(m.name||""));ms.sort((a,b)=>(a.name==="models/gemini-3.6-flash"?-1:0)-(b.name==="models/gemini-3.6-flash"?-1:0));process.stdout.write(ms.length?ms[0].name.replace(/^models\//,""):"");' "$BODY")"
          if [ -z "$MODELO" ]; then
            rm -f "$CONFIG"
            echo "::error::A chave foi aceita, mas o Google não anunciou nenhum modelo Flash com generateContent para este projeto."
            exit 1
          fi
          printf '%s' '{"contents":[{"parts":[{"text":"Responda somente OK."}]}],"generationConfig":{"maxOutputTokens":8}}' > "$RUNNER_TEMP/gemini-payload.json"
          set +e
          HTTP="$(curl --config "$CONFIG" --silent --show-error --request POST --header 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/gemini-payload.json" --output "$RUNNER_TEMP/gemini-geracao.json" --write-out '%{http_code}' \
            "https://generativelanguage.googleapis.com/v1beta/models/$MODELO:generateContent")"
          CURL_STATUS=$?
          set -e
          rm -f "$CONFIG"
          if [ "$CURL_STATUS" -ne 0 ] || [ "$HTTP" != "200" ]; then
            MSG="$(node -e 'const fs=require("node:fs");try{const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log(d.error?.message||"O Google não retornou detalhes.");}catch{console.log("Não foi possível ler a resposta do Google.");}' "$RUNNER_TEMP/gemini-geracao.json")"
            MSG="$(printf '%s' "$MSG" | tr '\n\r' '  ' | cut -c1-300)"
            echo "::error::A chave passou pela autenticação, mas a chamada generateContent falhou (modelo $MODELO, HTTP ${HTTP:-sem resposta}): $MSG. Confira cotas e acesso ao modelo."
            exit 1
          fi
          echo "API Gemini validada: chave, pacote br.ecoa.app, SHA-1 do certificado, modelo $MODELO e generateContent." >> "$GITHUB_STEP_SUMMARY"

      - name: Montar o APK
        working-directory: app-android/android
        env:
          ECOA_CHAVE_ARQUIVO: ${{ steps.chave.outputs.arquivo }}
          ECOA_VERSAO_CODIGO: ${{ github.run_number }}
          ECOA_VERSAO_NOME: 1.${{ github.run_number }}
          # (o Lúmen chama o Gemini direto do celular: a chave vai no APK, travada ao app no Google Cloud — LEIA-ME.md)
          # Nunca usar a chave geral do servidor no APK público: somente a chave exclusiva do Android.
          ECOA_GEMINI_CHAVE: ${{ secrets.GEMINI_API_KEY_APK }}
        run: |
          if [ -z "$ECOA_GEMINI_CHAVE" ]; then
            echo "::error::Falta o segredo GEMINI_API_KEY_APK. Configure uma chave exclusiva para o app Android em Settings → Secrets and variables → Actions."
            exit 1
          fi
          chmod +x gradlew
          if [ -f "$RUNNER_TEMP/chave/senha-descartavel" ]; then export ECOA_CHAVE_SENHA="$(cat "$RUNNER_TEMP/chave/senha-descartavel")"; fi
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Ecoa.apk"
          ls -la "$RUNNER_TEMP/Ecoa.apk"
          # a versão deste APK: o app instalado confere por ela se há atualização (Ajustes → Sobre)
          # (com as novidades que vão dentro deste APK: o aviso de versão nova mostra só as que o app instalado não tem)
          # (e o histórico dos APKs publicados: o do arquivo anterior, mais este)
          gh release download android -p Ecoa-versao.json -D "$RUNNER_TEMP/anterior" 2>/dev/null || true
          node ../scripts/versao-apk.mjs "$ECOA_VERSAO_CODIGO" "$ECOA_VERSAO_NOME" "$RUNNER_TEMP/anterior/Ecoa-versao.json" > "$RUNNER_TEMP/Ecoa-versao.json"
          cat "$RUNNER_TEMP/Ecoa-versao.json"

      - uses: actions/upload-artifact@v4
        with:
          name: Ecoa-apk
          path: ${{ runner.temp }}/Ecoa.apk
          retention-days: 14

      - name: Publicar (Releases → android)
        if: env.PRINCIPAL == 'true'
        run: |
          cat > "$RUNNER_TEMP/notas.md" <<'NOTAS'
          O Ecoa para Android: baixe o **Ecoa.apk** abaixo e abra no celular (o Android pede para permitir "instalar apps desconhecidos" na primeira vez).

          - O mesmo app do site, com a sua conta Google.
          - O widget da tela inicial: segure o dedo na tela inicial → Widgets → Ecoa.
          - O aviso de "tocando" com os botões, que mantém a música tocando com o app minimizado.

          As novidades do app chegam sozinhas (ele abre o site publicado); este arquivo só muda quando a parte de Android muda. Quando muda, o app avisa e atualiza por Ajustes → Sobre → Atualização do app.
          NOTAS
          gh release delete android --cleanup-tag --yes 2>/dev/null || true
          gh release create android "$RUNNER_TEMP/Ecoa.apk" "$RUNNER_TEMP/Ecoa-versao.json" --title "Ecoa para Android" --notes-file "$RUNNER_TEMP/notas.md" --target "$GITHUB_SHA" --latest=false
