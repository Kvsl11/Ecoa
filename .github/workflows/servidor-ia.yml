# O texto dos PDFs do acervo (Google Drive), para o Lumen responder com o que está dentro deles. O servidor da IA é o
# do GitHub Codespaces (.devcontainer/): ele baixa este texto do site publicado (data/textos-acervo.jsonl.gz), que a
# publicação do app (GitHub Pages) põe junto depois que este workflow termina.
# Toda semana lê os PDFs novos; dá para rodar na hora em Actions → Publicar o servidor da IA → Run workflow.
# O Modal (modal.com) é o servidor de reserva: o app usa o Codespace e, com ele desligado (enquanto liga sozinho) ou sem
# a cota do mês, usa o Modal. Ele é publicado sozinho a cada mudança no servidor (servidor-ia/) e toda semana, com os
# secrets MODAL_TOKEN_ID e MODAL_TOKEN_SECRET; CODESPACE_TOKEN (token clássico com o escopo "codespace") deixa o Modal
# ligar o Codespace sozinho; opcionais ANTHROPIC_API_KEY, GEMINI_API_KEY e YT_COOKIES.
name: Publicar o servidor da IA

on:
  workflow_dispatch:
    inputs:
      modal:
        description: Também publicar no Modal (o servidor de reserva)
        type: boolean
        default: true
  # o servidor mudou: o de reserva (Modal) passa a ter a versão nova sozinho
  push:
    branches: [main, master, ccr-59dd75f2-oirnca]
    paths: ['servidor-ia/**', '.github/workflows/servidor-ia.yml']
  # toda semana: lê os PDFs novos do acervo (o Lumen passa a saber o que entrou no Drive)
  schedule:
    - cron: '23 6 * * 1'

concurrency:
  group: servidor-ia
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      CODESPACE_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
      # (à mão, só com "Também publicar no Modal" marcado; na mudança do servidor e toda semana, sempre)
      PUBLICAR_MODAL: ${{ (github.event_name != 'workflow_dispatch' || inputs.modal) && 'sim' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # o texto dos PDFs do acervo do Drive, para o Lumen responder com o que está dentro deles: fica guardado entre as
      # publicações (cache) e cada vez lê até 800 arquivos novos, então os ~2 mil do acervo entram em poucas rodadas
      - name: Texto guardado dos PDFs do acervo
        uses: actions/cache@v4
        with:
          path: servidor-ia/textos-acervo.jsonl
          key: textos-acervo-${{ github.run_id }}
          restore-keys: textos-acervo-
      - name: Ler o texto dos PDFs do acervo (Drive)
        # (lê mesmo sem a chave da IA: a busca do Lumen no acervo, sem IA, também usa o texto dos PDFs; na mudança do
        # servidor, não: fica para a leitura da semana)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 30
        working-directory: servidor-ia
        run: |
          pip install -q pypdf
          python indexar_acervo.py --max 800 2>&1 | tail -5
          [ -f textos-acervo.jsonl ] && echo "::notice::$(wc -l < textos-acervo.jsonl) arquivos do acervo com o texto lido"
      - name: Sem o token do Modal
        if: env.PUBLICAR_MODAL == 'sim' && (env.MODAL_TOKEN_ID == '' || env.MODAL_TOKEN_SECRET == '')
        run: echo "::warning::Para o servidor de reserva (Modal), guarde o token nos secrets MODAL_TOKEN_ID e MODAL_TOKEN_SECRET."
      - name: Publicar no Modal
        if: env.PUBLICAR_MODAL == 'sim' && env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != ''
        working-directory: servidor-ia
        run: |
          pip install -q modal
          # os segredos do servidor (o Modal pede pelo menos um valor)
          args=(IA_PUBLICADO=1)
          [ -n "$ANTHROPIC_API_KEY" ] && args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
          [ -n "$GEMINI_API_KEY" ] && args+=("GEMINI_API_KEY=$GEMINI_API_KEY")
          [ -n "$YT_COOKIES" ] && args+=("YT_COOKIES=$YT_COOKIES")
          # o Modal liga o Codespace sozinho quando o app não o acha ligado (POST /codespace/ligar)
          if [ -n "$CODESPACE_TOKEN" ]; then
            args+=("IA_GITHUB_TOKEN=$CODESPACE_TOKEN" "IA_REPO=$GITHUB_REPOSITORY")
          else
            echo "::notice::Sem o secret CODESPACE_TOKEN: o Modal não liga o Codespace sozinho (o app usa o Modal enquanto o Codespace estiver desligado)."
          fi
          # o Modal é a reserva: o app usa primeiro o servidor do Codespace (ou do computador). Sem crédito no Modal
          # (o limite de gasto do mês, a conta desativada), a publicação fica para depois com um aviso, sem falhar;
          # qualquer outro erro falha como antes
          sem_credito='spend limit|billing|workspace .*disabled|disabled.*workspace|out of credits'
          if ! modal secret create songbook-ia "${args[@]}" --force > secret.log 2>&1; then
            cat secret.log
            if grep -qiE "$sem_credito" secret.log; then echo "::warning::O Modal está sem crédito: o servidor de reserva não foi publicado (o do Codespace continua valendo)."; exit 0; fi
            exit 1
          fi
          set +e
          modal deploy modal_app.py 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -qiE "$sem_credito" deploy.log; then
              echo "::warning::O Modal está sem crédito (limite de gasto do mês): o servidor de reserva não foi publicado agora. O app usa o servidor do Codespace; quando o crédito do Modal voltar, rode este workflow de novo (Actions → Publicar o servidor da IA → Run workflow)."
              exit 0
            fi
            exit "$status"
          fi
          url=$(python -c "import modal; print(modal.Function.from_name('songbook-ia', 'web').get_web_url())")
          echo "::notice::Servidor da IA no ar: $url"
