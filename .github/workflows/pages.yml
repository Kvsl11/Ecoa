# Publica a pasta public/ no GitHub Pages a cada push e uma vez por dia.
# Na publicação, copia do musicasparamissa.com.br as sugestões e cifras das próximas datas
# (o site não permite acesso direto pelo navegador), e do pocketterco.com.br o missal do dia e as orações.
# Antes do primeiro uso: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main, master, ccr-59dd75f2-oirnca]
  pull_request:
    branches: [main, master, ccr-59dd75f2-oirnca]
  workflow_dispatch:
  workflow_run: # depois de ler o texto dos PDFs do acervo: põe o texto novo no site (o Lumen do Codespace baixa); e depois de um APK novo
    workflows: [Publicar o servidor da IA, App de Android]
    types: [completed]
    branches: [main, master, ccr-59dd75f2-oirnca]
  schedule:
    - cron: '23 7 * * *' # todo dia às 04h23 (Brasília)

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read # (a lista das publicações do github-pages, para achar a que segura a fila)

# uma publicação por vez, na fila: a de depois espera a que está rodando terminar. Antes a nova cancelava a que
# estava rodando, e cada merge mostrava um "cancelled" (o push e, logo depois, o fim da publicação do servidor da IA
# disparavam duas publicações do mesmo commit)
concurrency:
  # Testes de PR não ficam presos atrás de uma publicação diária ou de outro deploy.
  # Publicações continuam serializadas para evitar dois deploys simultâneos.
  group: pages-${{ github.event_name == 'pull_request' && 'testes' || 'publicacao' }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  publicar:
    if: github.event_name != 'pull_request'
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache das cifras do Músicas para Missa
        uses: actions/cache@v4
        with:
          path: .mpm-cache
          key: mpm-${{ github.run_id }}
          restore-keys: mpm-
      - name: Copiar sugestões e cifras do Músicas para Missa
        continue-on-error: true # se o site estiver fora do ar, o app é publicado mesmo assim
        timeout-minutes: 25
        run: node scripts/mpm-sync.mjs --dias 12 --max 700
      - name: Cache das orações do Pocket Terço
        uses: actions/cache@v4
        with:
          path: .pt-cache
          key: pt-${{ github.run_id }}
          restore-keys: pt-
      - name: Copiar missal do dia, orações (Pocket Terço) e fontes (Junior Música Católica)
        continue-on-error: true
        timeout-minutes: 25
        run: node scripts/liturgia-sync.mjs --dias 21
      - name: Indexar o acervo litúrgico (pasta do Google Drive)
        if: github.event_name != 'push' && github.event_name != 'workflow_run' # os dados do acervo ficam salvos no repositório: só na atualização diária
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/acervo-sync.mjs
      - name: Cache das letras do Hinário Litúrgico da CNBB
        if: github.event_name != 'push' && github.event_name != 'workflow_run' # os dados do acervo ficam salvos no repositório: só na atualização diária
        uses: actions/cache@v4
        with:
          path: .hinario-cache
          key: hinario-${{ github.run_id }}
          restore-keys: hinario-
      - name: Letras do Hinário Litúrgico da CNBB (cadernos do acervo)
        if: github.event_name != 'push' && github.event_name != 'workflow_run' # os dados do acervo ficam salvos no repositório: só na atualização diária
        continue-on-error: true
        timeout-minutes: 25
        run: |
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          node scripts/hinario-sync.mjs
      - name: Cache das músicas do acervo
        if: github.event_name != 'push' && github.event_name != 'workflow_run' # os dados do acervo ficam salvos no repositório: só na atualização diária
        uses: actions/cache@v4
        with:
          path: .acervo-cache
          key: acervo-${{ github.run_id }}
          restore-keys: acervo-
      - name: Músicas e partituras dos arquivos do acervo
        if: github.event_name != 'push' && github.event_name != 'workflow_run' # os dados do acervo ficam salvos no repositório: só na atualização diária
        continue-on-error: true
        timeout-minutes: 60
        run: |
          command -v pdftoppm || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          node scripts/cantos-sync.mjs
      # o servidor da IA é o do GitHub Codespaces (.devcontainer/): o endereço dele (https://<nome>-7860.app.github.dev)
      # vai para o app, que assim acha o servidor em qualquer aparelho sem ler o QR code. O próprio Codespace grava o
      # endereço em .devcontainer/endereco.txt ao ligar (ligar.sh); a variável SERVIDOR_IA_URL (Settings → Secrets and
      # variables → Actions → Variables), se existir, vale mais. E o de reserva, no Modal ("reserva" e "reservaLumen"):
      # o app usa ele enquanto o Codespace liga sozinho, ou quando a cota do Codespace acabou
      - name: Endereço do servidor da IA (o Codespace e a reserva no Modal), para o app achar sozinho
        env:
          SERVIDOR_IA_URL: ${{ vars.SERVIDOR_IA_URL }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          # (o arquivo só existe depois que o Codespace liga a primeira vez com esta versão)
          if [ -z "$SERVIDOR_IA_URL" ] && [ -f .devcontainer/endereco.txt ]; then
            SERVIDOR_IA_URL=$(tr -d '[:space:]' < .devcontainer/endereco.txt)
          fi
          export SERVIDOR_IA_URL
          if [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ]; then pip install -q modal || true; fi
          python3 - <<'PY'
          import json, os
          dados = {}
          url = os.environ.get('SERVIDOR_IA_URL', '').strip()
          if url:
              dados['url'] = url
          if os.environ.get('MODAL_TOKEN_ID') and os.environ.get('MODAL_TOKEN_SECRET'):
              try:
                  import modal
                  dados['reserva'] = modal.Function.from_name('songbook-ia', 'web').get_web_url()
                  try:
                      dados['reservaLumen'] = modal.Function.from_name('songbook-ia', 'lumen').get_web_url()
                  except Exception:
                      pass
                  # o karaokê na placa de vídeo (uns 15 a 30 s por música): o app manda só o karaokê para lá
                  try:
                      dados['karaoke'] = modal.Function.from_name('songbook-ia', 'karaoke').get_web_url()
                  except Exception:
                      pass
              except Exception as e:
                  print(f"::notice::O servidor de reserva (Modal) ainda não está publicado ({type(e).__name__}): ele entra depois da próxima publicação do servidor")
          if not dados:
              print("::notice::Sem o endereço do Codespace ainda: ele é gravado sozinho quando o Codespace liga.")
              raise SystemExit(0)
          json.dump(dados, open('public/data/servidor-ia.json', 'w'))
          print(f"::notice::Servidor da IA do app: {dados}")
          PY
      # o texto dos PDFs do acervo (lido pelo workflow "Publicar o servidor da IA"): vai junto com o site, e o Lumen do
      # Codespace baixa daqui
      - name: Texto dos PDFs do acervo (para o Lumen)
        uses: actions/cache/restore@v4
        with:
          path: servidor-ia/textos-acervo.jsonl
          key: textos-acervo-ultimo
          restore-keys: textos-acervo-
      - name: Texto dos PDFs do acervo no site
        run: |
          if [ -s servidor-ia/textos-acervo.jsonl ]; then
            gzip -9 -c servidor-ia/textos-acervo.jsonl > public/data/textos-acervo.jsonl.gz
            echo "::notice::$(wc -l < servidor-ia/textos-acervo.jsonl) arquivos do acervo com o texto lido, $(du -h public/data/textos-acervo.jsonl.gz | cut -f1) no site"
          fi
      # o app de Android (o Ecoa.apk publicado pelo robô "App de Android") vai junto com o site: o botão "Baixar o app
      # para Android" baixa do próprio site (o link do GitHub redireciona, e no celular o download ficava parado)
      - name: O APK do app de Android no site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download android -p Ecoa.apk -D public --clobber && ls -la public/Ecoa.apk || echo "::notice::Ainda não há APK publicado"
          # (a versão do APK publicado: o app instalado compara com a dele e oferece a atualização)
          gh release download android -p Ecoa-versao.json -D public --clobber && cat public/Ecoa-versao.json || echo "::notice::O APK publicado ainda não tem o arquivo da versão"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      # Antes de publicar, libera a fila: o GitHub só faz uma publicação por vez, e uma que ficou presa ("Please cancel
      # <commit> first") segura todas as seguintes. Cancela as publicações dos últimos commits e do ambiente github-pages
      # que EXISTEM e não terminaram com sucesso, até as que aparecem como "cancelada" mas o GitHub ainda conta como em
      # andamento (foi o que travou o #406: "deployment_cancelled" na consulta e "in progress" na hora de publicar). Só
      # as que existem: mandar cancelar um commit que ainda não tinha publicação fazia ela já nascer cancelada (foi o que
      # travou do #404 ao #407)
      - name: Destravar publicações presas
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ids = new Set();
            const { data: commits } = await github.rest.repos.listCommits({ owner, repo, sha: context.ref, per_page: 15 });
            commits.forEach((c) => ids.add(c.sha));
            try {
              const { data: deps } = await github.rest.repos.listDeployments({ owner, repo, environment: 'github-pages', per_page: 30 });
              deps.forEach((d) => ids.add(d.sha));
            } catch (e) { core.info(`Sem a lista de publicações do ambiente (${e.status || e.message})`); }
            ids.delete(context.sha);
            for (const id of ids) {
              let status = '';
              try { status = (await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id })).data.status || ''; } catch (e) { continue; } // (não existe: não mexe)
              if (status === 'succeed') continue;
              try {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', { owner, repo, id });
                core.info(`Publicação ${id.slice(0, 7)} (${status || 'sem situação'}): cancelada`);
              } catch (e) { core.info(`Publicação ${id.slice(0, 7)} (${status || 'sem situação'}): ${e.status || e.message}`); }
            }
      # A publicação oficial. Ela espera a fila pelo máximo que a ação deixa (10 minutos)
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
          error_count: 30
      # O GitHub recusou ("Please cancel <commit> first"): cancela exatamente a publicação que ele aponta e tenta de novo,
      # com o número do próprio commit (a de antes, com um número inventado, recebia 404). Depois espera a fila até 15
      # minutos, sem cancelar a própria publicação
      - id: deploy2
        name: Publicar de novo, liberando a publicação que o GitHub aponta
        if: steps.deploy.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          ARTEFATO: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const espera = (ms) => new Promise((ok) => setTimeout(ok, ms));
            const { data: lista } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: context.runId, name: process.env.ARTEFATO });
            const artefato = lista.artifacts[0];
            if (!artefato) { core.setFailed(`Artefato ${process.env.ARTEFATO} não encontrado`); return; }
            let dep = null;
            for (let tentativa = 1; tentativa <= 8 && !dep; tentativa++) {
              try {
                ({ data: dep } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                  owner, repo, artifact_id: artefato.id, pages_build_version: context.sha, oidc_token: await core.getIDToken(),
                }));
              } catch (e) {
                const presa = /cancel ([0-9a-f]{40})/i.exec(String(e.message))?.[1];
                core.warning(`Tentativa ${tentativa}: ${e.status || ''} ${e.message}`);
                if (presa && presa !== context.sha) {
                  try { await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', { owner, repo, id: presa }); core.notice(`Publicação presa cancelada: ${presa.slice(0, 7)}`); } catch (e2) { core.info(`Cancelar ${presa.slice(0, 7)}: ${e2.status || e2.message}`); }
                }
                await espera(20000);
              }
            }
            if (!dep) { core.setFailed('O GitHub não aceitou a publicação em 8 tentativas'); return; }
            const id = dep.id || context.sha;
            core.info(`Publicação ${id}`);
            const FALHOU = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'deployment_attempt_error'];
            const ate = Date.now() + 15 * 60 * 1000;
            while (Date.now() < ate) {
              await espera(5000);
              let status = '';
              try { status = (await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id })).data.status || ''; } catch { status = ''; }
              core.info(`Situação: ${status || '(sem resposta)'}`);
              if (status === 'succeed') { core.setOutput('page_url', dep.page_url || ''); core.notice('Publicado'); return; }
              if (FALHOU.includes(status)) { core.setFailed(`A publicação terminou como ${status}`); return; }
            }
            core.setFailed('A publicação não terminou em 15 minutos');
