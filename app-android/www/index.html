<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecoa</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font:16px system-ui,sans-serif;text-align:center;padding:24px}</style></head>
<body><p id="m">Abrindo o Ecoa…<br><small>Sem internet? O Ecoa precisa dela para abrir pela primeira vez.</small></p>
<script>
// no idioma do aparelho: português, inglês ou espanhol (os outros idiomas, em inglês)
try { var l = String((navigator.languages && navigator.languages[0]) || navigator.language || 'pt').toLowerCase();
  if (l.indexOf('es') === 0) document.getElementById('m').innerHTML = 'Abriendo Ecoa…<br><small>¿Sin internet? Ecoa la necesita para abrir por primera vez.</small>';
  else if (l.indexOf('pt') !== 0) document.getElementById('m').innerHTML = 'Opening Ecoa…<br><small>No internet? Ecoa needs it to open for the first time.</small>';
} catch (e) {}
</script></body></html>
