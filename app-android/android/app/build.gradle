apply plugin: 'com.android.application'

android {
    namespace = "br.ecoa.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "br.ecoa.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // (o número da versão do APK vem do robô do GitHub: sobe a cada APK novo, para instalar por cima do anterior)
        versionCode((System.getenv("ECOA_VERSAO_CODIGO") ?: "1") as int)
        versionName(System.getenv("ECOA_VERSAO_NOME") ?: "1.0")
        // a chave do Gemini (o segredo GEMINI_API_KEY do GitHub, que o robô passa na montagem): o Lúmen chama a API
        // direto do celular. Sem ela, o APK monta e o Lúmen usa o servidor ou a busca simples
        buildConfigField "String", "GEMINI_CHAVE", "\"${(System.getenv("ECOA_GEMINI_CHAVE") ?: "").replaceAll('[^A-Za-z0-9_-]', '')}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // (o yt-dlp do APK vem com o Python, o ffmpeg e o QuickJS compilados para cada processador: só os dos celulares,
        // 64 e 32 bits. Os de computador — x86 — deixariam o APK com o dobro do tamanho)
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // a chave que assina o APK: a mesma sempre (senão o APK novo não instala por cima do anterior). O robô do GitHub
    // abre ela com a senha guardada nos segredos do repositório (veja app-android/LEIA-ME.md)
    signingConfigs {
        release {
            def chave = System.getenv("ECOA_CHAVE_ARQUIVO")
            if (chave) {
                storeFile file(chave)
                storePassword System.getenv("ECOA_CHAVE_SENHA")
                keyAlias "ecoa"
                keyPassword System.getenv("ECOA_CHAVE_SENHA")
            }
        }
    }
    // o Python e o ffmpeg do yt-dlp são extraídos do APK na primeira vez (a biblioteca pede as bibliotecas nativas
    // fora do APK compactado)
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    buildTypes {
        release {
            if (System.getenv("ECOA_CHAVE_ARQUIVO")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Firebase AI Logic: Gemini direto no APK, sem servidor próprio.
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-ai'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    // Dependências exigidas pelo SDK Java para operações assíncronas e streaming.
    implementation 'com.google.guava:guava:31.0.1-android'
    implementation 'org.reactivestreams:reactive-streams:1.0.4'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // o login do Google pelo próprio Android (o do site não abre dentro de um app)
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    // o aviso de "tocando" com os botões, no jeito dos players de música
    implementation "androidx.media:media:1.7.0"
    // os downloads do YouTube no próprio celular (sem o servidor Python): o yt-dlp com o Python, o QuickJS e o ffmpeg
    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
    // o karaokê no próprio celular: o modelo UVR (baixado na primeira vez) roda no ONNX Runtime
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.22.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
